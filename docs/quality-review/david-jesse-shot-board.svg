  <text class="small" x="552" y="443">16:9 frame</text>
  <text class="small" x="552" y="465">Hold both faces</text>
  <text class="small" x="552" y="487">Let the gesture read</text>
  <text class="small" x="910" y="443">Same eye line</text>
  <text class="small" x="910" y="465">Faces above subtitles</text>
  <text class="small" x="910" y="487">Bundle in the middle</text>
  <text class="small" x="910" y="519">David nearer camera</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title description">
  <title id="title">David and Jesse character silhouettes and conversation framing</title>
  <desc id="description">David wears a blue-green tunic and small satchel. Jesse has broader shoulders, grey hair and a clay-coloured mantle. The landscape shot shows both faces and the bundle. Portrait staggers the actors in depth and leaves the lower screen for subtitles.</desc>

  <text class="body" x="254" y="199">Youthful, lean silhouette</text>
  <text class="body" x="254" y="222">Short dark curls, light satchel</text>
  <text class="body" x="254" y="245">Alert gaze, relaxed hands</text>
  <text class="label" x="782" y="170">JESSE</text>
  <text class="body" x="782" y="199">Older face, broader stance</text>
  <text class="body" x="782" y="222">Grey beard, layered mantle</text>
  <text class="body" x="782" y="245">Measured gesture and weight</text>
